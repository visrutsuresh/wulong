name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Set up scrub-patterns.txt
        run: cp scrub-patterns.txt.example scrub-patterns.txt

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run example 01 and assert output
        run: |
          python3 examples/01_init_and_doctor.py > /tmp/ex01_actual.txt
          diff tests/expected/ex01.txt /tmp/ex01_actual.txt

      - name: Run example 02 and assert output
        run: |
          python3 examples/02_gate_check.py > /tmp/ex02_actual.txt
          diff tests/expected/ex02.txt /tmp/ex02_actual.txt
